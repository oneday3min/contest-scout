name: Daily contest picks

# Every morning 07:00 Korea time (22:00 UTC the day before). Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Find and analyze new contests
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/daily.js
      - name: Save today's picks
        run: |
          git config user.name "contest-scout-bot"
          git config user.email "contest-scout-bot@users.noreply.github.com"
          git add public/daily.json
          git diff --cached --quiet || git commit -m "Daily picks $(date -u +%F)"
          git push
